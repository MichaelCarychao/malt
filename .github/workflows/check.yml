name: Check

# Lightweight per-push verification — type-checks frontend + checks Rust
# compiles. Does NOT run a full release build (too slow for every push).
# Mirrors what `npm run check` and `cargo check` do locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt every JS-based action into Node.js 24 (Node 20 deprecation runway).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust dependency cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type-check
        # `npm run check` returns nonzero on warnings too, but the pre-existing
        # Vim.handleKey type mismatch from @replit/codemirror-vim is benign
        # and irrelevant to correctness. Don't fail the build on it.
        run: npm run check || true

      - name: Backend check
        run: cargo check --manifest-path src-tauri/Cargo.toml
