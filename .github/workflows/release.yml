name: Release

# Triggers on pushing a tag like v0.2.0 — produces a DRAFT GitHub release
# with Windows .msi/.exe and macOS .dmg attached. You review the draft
# and publish it manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # also allow a manual trigger from the Actions tab

# Opt every JS-based action (actions/checkout, actions/setup-node, etc.)
# into Node.js 24 runtime. Node 20 is being removed from the runners on
# 2026-09-16; this env var is GitHub's documented opt-in path until our
# action versions all natively target Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only — ONNX Runtime (used by fastembed) has no
          # prebuilt Intel binaries on the current ort version, which
          # breaks the universal build. Modern Macs are Apple Silicon;
          # Intel Mac users can build from source if needed.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust dependency cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build + draft GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing (Developer ID) + notarization — DISABLED ──
          # Intentionally commented out until the Apple signing secrets exist.
          # DO NOT pass these as `${{ secrets.* }}` while the secrets are unset:
          # an unset secret resolves to an EMPTY string, and Tauri's bundler
          # treats a present-but-empty APPLE_CERTIFICATE as "sign this app" — it
          # runs `security import` on an empty cert and FAILS the whole macOS
          # build (it does NOT fall back to unsigned). With these absent, macOS
          # builds unsigned and succeeds.
          # TO ENABLE SIGNING: add all six repo secrets, then uncomment these.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing (separate from OS-level code signing).
          # Private key + optional password live in GitHub secrets; signed
          # .sig files are emitted next to each binary so the in-app
          # updater can verify update integrity.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "malt ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's in this release. Both builds are currently unsigned: on Windows, click More info → Run anyway at the SmartScreen prompt; on macOS, right-click the app → Open the first time to get past Gatekeeper. Code signing is on the roadmap."
          releaseDraft: true
          # Must stay false: the in-app updater fetches /releases/latest/...,
          # and GitHub's "latest" endpoint skips anything flagged prerelease,
          # so a prerelease would 404 the updater even after you publish it.
          # Releases are still unpublished until you manually publish the draft
          # (releaseDraft: true above), so this does not make anything public.
          prerelease: false
          # Emits latest.json next to the binaries — the manifest the in-app
          # updater fetches to detect new versions.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
