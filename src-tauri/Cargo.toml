[package]
name = "malt"
version = "0.5.3"
description = "A cross-platform AI-augmented nvalt successor"
authors = ["Michael Carychao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "malt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
tantivy = "0.25"
keyring = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_yaml = "0.9"
tauri-plugin-dialog = "2.7.1"
fastembed = "5.14.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8.48"
pulldown-cmark = "0.13.4"
epub-builder = "0.8.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# Per-note encryption: AES-256-GCM authenticated encryption + Argon2id
# password KDF. base64 for the single-line ciphertext envelope. rand for
# fresh nonces and salts. These are deliberately RustCrypto crates so we
# don't ship OpenSSL.
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"

